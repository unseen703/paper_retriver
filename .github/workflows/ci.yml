name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      # Same gate as local. Keeping CI and `make verify` on one definition
      # stops them drifting apart.
      - name: Verify
        run: uv run python scripts/verify.py
