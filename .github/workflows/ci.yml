name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.11
      - run: uv sync
      # Same gate as local. Keeping CI and `make verify` on one definition
      # stops them drifting apart.
      - name: Verify
        run: uv run python scripts/verify.py

  # The frontend had no CI job at all until code review went looking, and the
  # consequences were not hypothetical: `npm run build` was failing on five
  # TypeScript errors that nobody had seen, and a module-name collision which
  # only manifests on a case-SENSITIVE filesystem would still not have been
  # caught here, because nothing on Linux ever compiled this code.
  #
  # `typecheck` is `tsc -b --noEmit`, which is what `build` runs. A bare
  # `tsc --noEmit` resolves a different config and passes while the build
  # fails -- which is exactly how those five errors survived.
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
