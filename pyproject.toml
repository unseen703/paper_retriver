[project]
name = "paper-recommender"
version = "0.1.0"
description = "Citation-graph paper recommender for AI/ML research"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "tenacity>=9.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "alembic>=1.14",
    "networkx>=3.4",
    "pyyaml>=6.0",
    "structlog>=24.4",
    "typer>=0.15",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# BUILD.md verifies R0.2 with `from app.config import settings, filters`, so
# `app` is the import root -- backend/ is the source dir, not a package.
[tool.hatch.build.targets.wheel]
packages = ["backend/app"]

[tool.ruff]
line-length = 100
src = ["backend"]
exclude = ["legacy", ".venv", "frontend"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
mypy_path = "backend"
files = ["backend/app/services", "backend/app/models"]  # strict where it matters

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["backend/tests"]
pythonpath = ["backend"]
# `dash` installs a pytest plugin that imports pydantic at collection time and
# aborts the whole run when it is missing from the ambient interpreter. Nothing
# here uses dash; disabling it keeps `make test` working outside the uv venv.
addopts = "-p no:dash"
